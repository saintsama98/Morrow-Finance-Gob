name: scheduled

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork:
    name: fork suites
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: fork suites
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: forge test --match-path "contracts/test/fork/*" --threads 1

  halmos:
    name: halmos
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install halmos
        run: pip install halmos==0.3.3

      - name: build
        env:
          FOUNDRY_OUT: cache/halmos-out
        run: forge build --ast --extra-output storageLayout metadata

      - name: proofs listed in docs/verification.md
        env:
          FOUNDRY_OUT: cache/halmos-out
        run: |
          prove() {
            halmos --root . --forge-build-out cache/halmos-out --contract "$1" --function "$2\\(" \
              --solver yices --solver-threads 1 --solver-timeout-assertion 600000
          }
          prove WadMathSymbolicTest check_upMinusDownAtMostOne
          prove WadMathSymbolicTest check_matchesPlainDivisionWhenNoOverflow
          prove WadMathSymbolicTest check_wadHelpersMatch
          prove EpochMathSymbolicTest check_exitAtLowerPrice_entryAtHigherPrice
          prove EpochMathSymbolicTest check_zeroPriceFillsNothing
