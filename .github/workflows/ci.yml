name: ci

on:
  push:
    branches: [main, "feat/**", "chore/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: default

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: versions
        run: forge --version

      - name: format check
        run: forge fmt --check

      - name: build
        run: forge build

      - name: test (unit, fuzz, stateful invariants)
        run: forge test -vvv
